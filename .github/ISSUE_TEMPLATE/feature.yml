name: 功能请求
description: 缺什么能力，先评估再排期
labels: [kind/feature, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在哪里不顺，具体场景是什么，谁受影响
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的做法
      description: 已经有想法就写清对外行为；没有就写「暂无」
      placeholder: 暂无
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 完成的判定
      description: 逐条写成可执行的判定：跑哪条命令、看到什么结果
      placeholder: |
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: 明确不做的部分
      description: 这次不覆盖的场景；没有写「无」
      placeholder: 无
    validations:
      required: true
